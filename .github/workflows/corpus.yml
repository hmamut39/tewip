# Re-derives the numbers somebody checked by hand, against real projects at a pinned commit.
#
# Phase 43 shipped 166 false accusations - correct Java tests told they were worthless - and the only
# reason anybody found out is that Keycloak was cloned and 166 tests were read one at a time. Every
# unit test passed before that and after it. A suite that cannot see its worst failure is not
# measuring the thing that matters, and the thing that matters is what Tewip says about other
# people's code.
#
# Not on every push: these are large clones and the checks take minutes. Weekly, before a release,
# and whenever somebody asks.
name: corpus

on:
  schedule:
    - cron: '0 5 * * 2' # Tuesdays, 05:00 UTC
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      repo:
        description: 'One repository from corpus/expected.json; empty runs all'
        default: ''

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Keyed on the manifest, and only on the manifest.
      #
      # `restore-keys: corpus-` used to fall back to clones saved under an older manifest, which
      # is a cache that can hand back a tree other than the one the numbers were verified against.
      # immich's `done` measured 73 covering tests from a fresh clone, on both Linux and Windows,
      # and 15 under a restored cache - the same commit, two different answers, and four days spent
      # reading that as a platform difference. Whatever the mechanism, a corpus whose clones might
      # not be the commit they claim has no numbers, so the fallback is gone: a changed manifest
      # now pays for a cold cache, which costs minutes and is the cheaper half of that trade.
      - name: Reuse the clones
        uses: actions/cache@v5
        with:
          path: ~/.cache/tewip-corpus
          key: corpus-${{ hashFiles('corpus/expected.json') }}

      # A dispatched run is somebody asking, so it reports what moved and exits 0. The weekly run
      # and a release tag are the guard and still fail, which is where failing belongs: nobody
      # asked, so a number that drifted unnoticed is the whole fear.
      #
      # Phase 203, after three "corpus: All jobs have failed" emails in one afternoon - every one a
      # run dispatched on purpose to find out what a fix had moved. The owner cannot tell those from
      # a broken build, and a red build nobody can trust is a red build nobody reads.
      - name: Re-derive the verified numbers
        env:
          TEWIP_CORPUS: ~/.cache/tewip-corpus
        run: node scripts/corpus.ts ${{ inputs.repo }} ${{ github.event_name == 'workflow_dispatch' && '--asking' || '' }}
