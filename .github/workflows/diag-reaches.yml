# Throwaway: prints the import-graph walk's intermediate state on Linux, to diff against Windows.
#
# `tewip done` reports 73 test files reaching immich's pinned change on Windows and 15 on Linux, and
# every count either side of the walk agrees - 3,140 source files, 293 test files, the same `start`
# numbers, and `tewip review` matches on both. So the disagreement is inside the walk, and reasoning
# about it from one platform has already produced two wrong answers.
#
# The clone is made by scripts/corpus.ts itself rather than by hand here, so it is the same clone
# the corpus measures: same filter, same depth, same forced checkout, same symlink handling.
# Delete this file once the cause is found.
name: diag reaches

on:
  push:
    branches: [fix/reaches-index-token]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      TEWIP_CORPUS: ${{ github.workspace }}/corpus-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Let the corpus runner make the clone, and say what it measures
        shell: bash
        run: node scripts/corpus.ts immich --asking

      - name: Trace the walk
        shell: bash
        run: node eval/reaches-parity.ts "$TEWIP_CORPUS/immich" packages/sdk/src/fetch-client.ts

      - name: What the front door looks like here
        shell: bash
        run: |
          set -eux
          ls -la "$TEWIP_CORPUS/immich/packages/sdk/src/" || echo "no packages/sdk/src"
          git -C "$TEWIP_CORPUS/immich" ls-files -s packages/sdk/src/index.ts || echo "not tracked"
          cat "$TEWIP_CORPUS/immich/packages/sdk/src/index.ts" || true
