# Publishes the editor extension to Open VSX, which is what Cursor, Windsurf, VSCodium, Gitpod and
# Theia search. It is **not** the Visual Studio Marketplace: VS Code reads only Microsoft's registry,
# and that one needs an Azure DevOps organisation with a subscription behind it.
#
# No token is stored anywhere. Open VSX's trusted publishing exchanges this workflow's OIDC identity
# for a token that lives a few minutes, which is why `id-token: write` is the only permission that
# matters here. The same idea as the MCP registry workflow beside this one.
#
# Set up once, in the browser, by the person who owns the namespace:
#   1. open-vsx.org -> log in with GitHub -> profile -> "Log in with Eclipse" -> agree to the
#      Publisher Agreement. (A signature; it cannot be automated.)
#   2. open-vsx.org/user-settings/namespaces -> create the namespace `hmamut39`. It has to match the
#      `publisher` field in extensions/vscode/package.json.
#   3. open-vsx.org/user-settings/trusted-publishers -> register GitHub with
#      owner `hmamut39`, repo `tewip`, workflow `.github/workflows/publish-extension.yml`,
#      and no environment.
#
# After that every `v*` tag publishes, and nobody touches it again.
name: Publish the editor extension to Open VSX

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # how Open VSX knows this really is hmamut39/tewip

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Keep the extension's version with the release
        working-directory: extensions/vscode
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          # Only when a tag triggered this. A manual run publishes whatever the file already says.
          if [ "$tag" != "$GITHUB_REF" ]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = process.argv[1];
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('extension version set to', p.version);
            " "$tag"
          fi

      - name: Check the publisher matches the namespace
        working-directory: extensions/vscode
        run: |
          publisher="$(node -p "require('./package.json').publisher")"
          echo "publisher: $publisher"
          # A mismatch here is the commonest publish failure, and the error it produces is obscure.
          if [ "$publisher" != "hmamut39" ]; then
            echo "package.json publisher is '$publisher' but the Open VSX namespace is 'hmamut39'."
            exit 1
          fi

      - name: Package
        working-directory: extensions/vscode
        run: npx -y @vscode/vsce@latest package --allow-missing-repository --skip-license

      - name: Publish to Open VSX
        working-directory: extensions/vscode
        run: npx -y ovsx@latest publish *.vsix --trusted-publishing

      - name: Keep the built extension on the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tewip-vsix
          path: extensions/vscode/*.vsix
          if-no-files-found: warn
