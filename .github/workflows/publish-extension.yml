# Publishes the editor extension to Open VSX, which is what Cursor, Windsurf, VSCodium, Gitpod and
# Theia search, and attaches the built .vsix to the release.
#
# The Visual Studio Marketplace - what VS Code itself searches - is a separate registry and is
# published by hand: the .vsix attached to the release is uploaded at
# marketplace.visualstudio.com/manage/publishers/hmamut39. Publishing it from CI instead would need
# a token from an Azure DevOps organisation, and creating one of those now requires an active Azure
# subscription; the manual upload needs no subscription, no token and no card.
#
# Two ways in, and it takes whichever is available.
#
# **Trusted publishing** needs no secret: Open VSX exchanges this workflow's OIDC identity for a token
# that lives a few minutes. It is the better route, and it is not available yet here, because the
# registry only offers it to a namespace **owner** - and ownership is granted by a claim that requires
# twelve months of public GitHub history. This account reaches that in December 2026.
#
# **An access token** works today. A namespace contributor may publish, which is what creating a
# namespace makes you. Put the token in the repository as the secret OVSX_PAT:
#   open-vsx.org -> avatar -> Settings -> Access Tokens -> Generate New Token (copy it once)
#   github.com/hmamut39/tewip/settings/secrets/actions -> New repository secret -> OVSX_PAT
#
# When ownership comes through, register a trusted publisher (owner `hmamut39`, repo `tewip`, workflow
# `.github/workflows/publish-extension.yml`, no environment), delete the secret, and this keeps working
# without any other change - `ovsx` prefers a token when one is given and falls back to OIDC when it is
# not.
name: Publish the editor extension to Open VSX

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to attach the built .vsix to the release
  id-token: write # how Open VSX knows this really is hmamut39/tewip

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # The extension keeps its own version line. Taking it from the repository tag conflated two
      # different things - the extension was on 0.7.0 while the repository was on 0.33.0 - and would
      # have jumped it to the repository's number on the next release. Bump it in its package.json.
      - name: Check the publisher matches the namespace
        working-directory: extensions/vscode
        run: |
          publisher="$(node -p "require('./package.json').publisher")"
          echo "publisher: $publisher"
          # A mismatch here is the commonest publish failure, and the error it produces is obscure.
          if [ "$publisher" != "hmamut39" ]; then
            echo "package.json publisher is '$publisher' but the Open VSX namespace is 'hmamut39'."
            exit 1
          fi

      # The extension has its own version and most releases do not touch it. Open VSX refuses a
      # version it already holds, which turned every such release into a red workflow that had to be
      # read before it could be ignored - the surest way to stop reading them. A release that does
      # not change the extension should simply not publish it.
      - name: Is this version already on Open VSX?
        id: already
        working-directory: extensions/vscode
        run: |
          version="$(node -p "require('./package.json').version")"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/hmamut39/tewip/$version")"
          echo "extension version $version -> open-vsx returned $code"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Already on Open VSX. Nothing to do; bump extensions/vscode/package.json to publish a new one."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Skipping is right when the extension genuinely did not change, and wrong - silently - when it
      # changed and its version did not. That happened on 2026-10-11: the extension was bumped to
      # 0.10.0 *after* the v0.50.0 tag was pushed, so this workflow ran against 0.9.0, found 0.9.0
      # already published, skipped, and reported success. Nothing anywhere said the new extension had
      # not shipped. A skip that is actually a miss has to be loud.
      - name: Did the extension change without its version changing?
        if: steps.already.outputs.published == 'true' && startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --quiet --depth=50 || true
          # Release tags only. `--sort=-v:refname` puts `vscode-0.6.0` above `v0.53.0`, because the
          # sort falls back to comparing strings and `s` beats `0` - so the first run of this guard
          # compared against a tag from six weeks earlier and failed a release that was correct.
          previous="$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v "^${GITHUB_REF#refs/tags/}$" | head -1)"
          if [ -z "$previous" ]; then
            echo "No earlier tag to compare against; nothing to check."
            exit 0
          fi
          changed="$(git diff --name-only "$previous"..HEAD -- extensions/vscode/ || true)"
          if [ -n "$changed" ]; then
            echo "::error::extensions/vscode changed since $previous but its version is already on Open VSX."
            echo "Changed files:"; echo "$changed"
            echo ""
            echo "Bump extensions/vscode/package.json BEFORE pushing the tag, then re-tag."
            echo "To publish the current build now: gh workflow run publish-extension.yml"
            exit 1
          fi
          echo "The extension did not change since $previous, so skipping it is correct."


      # Packaged on every run, even when Open VSX already has this version, because the file is also
      # what gets attached to the GitHub release - and that file is how the extension reaches the
      # Visual Studio Marketplace, which is uploaded by hand.
      - name: Package
        working-directory: extensions/vscode
        run: npx -y @vscode/vsce@latest package --allow-missing-repository --skip-license

      - name: Publish to Open VSX
        if: steps.already.outputs.published == 'false'
        working-directory: extensions/vscode
        env:
          # Empty when no secret is set, and `ovsx` then uses the workflow's OIDC identity instead.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            echo "Publishing with the access token."
          else
            echo "No OVSX_PAT secret: trying trusted publishing, which needs a registered trusted publisher."
          fi
          npx -y ovsx@latest publish *.vsix

      # The Visual Studio Marketplace - which is what VS Code itself searches - is published by
      # uploading this file on the publisher page by hand. Automating it needs a token from an Azure
      # DevOps organisation, and creating one of those now requires an active Azure subscription
      # with a card behind it (Microsoft's own prerequisites say so). Attaching the file to the
      # release is the part that does not need any of that: every version then has a build anybody
      # can download and upload, instead of a CI artifact that expires.
      - name: Attach the extension to the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: extensions/vscode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" ./*.vsix --clobber
            echo "Attached to release $tag. To publish to the Visual Studio Marketplace, download it"
            echo "and upload it at https://marketplace.visualstudio.com/manage/publishers/hmamut39"
          else
            echo "No release exists for $tag yet, so there is nothing to attach it to."
            echo "Create the release and re-run this workflow, or upload the artifact below by hand."
          fi

      - name: Keep the built extension on the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tewip-vsix
          path: extensions/vscode/*.vsix
          if-no-files-found: warn
