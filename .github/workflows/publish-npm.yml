# Publishing tewip-ai to npm from CI, with no token anywhere.
#
# Why this exists at all: every release until now has been `npm publish` from the author's laptop,
# authenticated by a granular token. That token expires **15 January 2027** and cannot be renewed
# past it, because that is the day npm stops allowing a granular token to publish. This is the
# replacement, and it is better than the thing it replaces - npm hands the workflow a short-lived
# OIDC credential for one publish, so there is no long-lived secret to leak, rotate or forget.
#
# It also publishes **provenance** automatically: a signed statement of which commit and which
# workflow produced the tarball, which a laptop publish cannot make. That needs the repository and
# the package to be public, and both are.
#
# It **stages** rather than publishes, and that is deliberate. Today there is an air gap: someone
# with write access to this repository cannot push to npm, because the credential lives on a laptop.
# A trusted publisher allowed to run `npm publish` removes that gap - repo write would become the
# right to ship to everyone who installs this. Staging keeps it: `npm stage approve` needs
# interactive two-factor authentication and explicitly cannot use the OIDC token, so a release still
# takes a person, exactly as it does now. npm labels direct publishing "not recommended" for this
# reason, and the one property worth keeping is the one it would cost.
#
# The suite runs here before anything is published. Today the author runs it by hand first; a
# workflow that skipped it would be a step backwards, and `tests.yml` does not run on a tag.
name: publish to npm

on:
  push:
    tags: ['v*']
  # Kept for a re-run after a failure, without having to move a tag.
  workflow_dispatch:

permissions:
  contents: read
  # The whole mechanism. Without this npm has no OIDC token to exchange and the publish is refused.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later. Node 24 ships a new enough npm today, and
      # saying so out loud costs a second and turns a confusing auth error into a clear one.
      - name: npm new enough to publish without a token
        run: |
          V="$(npm --version)"
          echo "npm $V"
          node -e "
            const [maj, min, patch] = process.argv[1].split('.').map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1)));
            if (!ok) { console.error('npm ' + process.argv[1] + ' cannot use trusted publishing; 11.5.1 is the minimum'); process.exit(1); }
            console.log('npm ' + process.argv[1] + ' can publish without a token');
          " "$V"

      - name: Install
        run: npm ci

      # A tag that does not match the version in package.json publishes the wrong thing under the
      # right name, and nothing downstream would notice.
      - name: The tag and package.json agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag $tag, package.json $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json $pkg - nothing was published"
            exit 1
          fi

      # Nothing unverified goes out. This is what the author does by hand before every publish, and
      # a tag push does not trigger tests.yml.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: The unit suite
        run: npm run test:engine

      # npm refuses a version it already has, with an error that reads like a failure rather than a
      # no-op. A release that was already published is not a problem worth going red over.
      - name: Is this version already on npm?
        id: already
        run: |
          version="$(node -p "require('./package.json').version")"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/tewip-ai/$version")"
          echo "tewip-ai@$version -> registry returned $code"
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Already on npm. Nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # No NODE_AUTH_TOKEN, and that is the point: the credential is the OIDC token npm exchanges
      # for this workflow's identity. Provenance is generated automatically here, so --provenance is
      # not passed.
      #
      # `stage`, not `publish`: this leaves the version waiting for a person to approve it. The
      # trusted publisher is deliberately not allowed to publish directly.
      - name: Stage the release for approval
        if: steps.already.outputs.published == 'false'
        run: npm stage publish

      # A staged version that nobody approves is not released, and a workflow that ends green
      # without saying so would let a release sit unnoticed.
      # A staged version that nobody approves is not released, and a workflow that ends green
      # without saying so would let a release sit unnoticed.
      #
      # This used to print `npm stage approve tewip-ai@$version`, which npm does not accept: the
      # command takes a stage id and nothing else. So the one instruction this workflow exists to
      # hand over was a command that fails, and the way out was to go and find a UUID. Worse, a
      # wrong UUID fails with `404 staged version not found`, which reads like the release was lost
      # rather than like the argument was wrong. The id is read from the registry and printed here.
      - name: What is waiting for you
        if: steps.already.outputs.published == 'false'
        run: |
          version="$(node -p "require('./package.json').version")"
          # Best effort: if the read fails the release is still staged, and the fallback below says
          # how to find the id by hand rather than this step going red over a summary.
          #
          # Matched on the version alone. The first version of this also required
          # `status === 'staged'`, and a version that has just been published reads `validating`
          # for the first few seconds while npm checks the tarball - which is exactly when this
          # step runs. So it found nothing and printed the fallback, failing at the one job it was
          # added for, on the first release after it was added. There is only ever one stage per
          # version, so the status does not help identify it; what the status is worth saying is
          # said to the reader instead.
          id="$(npm stage list tewip-ai --json 2>/dev/null \
            | node -e "
                let s = '';
                process.stdin.on('data', (d) => { s += d; });
                process.stdin.on('end', () => {
                  try {
                    const row = JSON.parse(s).find((r) => r.version === process.argv[1]);
                    process.stdout.write(row ? row.id : '');
                  } catch { process.stdout.write(''); }
                });
              " "$version" || true)"
          {
            echo "### tewip-ai@$version is staged, not yet released"
            echo ""
            echo "Built and tested here, with provenance, and no token was used. **Nobody can install it until you approve it.**"
            echo ""
            if [ -n "$id" ]; then
              echo 'Copy this, it is the whole command:'
              echo ""
              echo '```'
              echo "npm stage approve $id"
              echo '```'
            else
              echo "The stage id could not be read from here. Find it and approve with:"
              echo ""
              echo '```'
              echo "npm stage list tewip-ai"
              echo "npm stage approve <the id it prints>"
              echo '```'
            fi
            echo ""
            echo "It asks for your two-factor code. \`npm stage approve\` takes a stage id only -"
            echo "a package name or a version is rejected with a 404 that reads as if the release"
            echo "were missing."
            echo ""
            echo "If it refuses at first, npm is still validating the tarball. Wait a few seconds"
            echo "and run the same command again."
            echo ""
            echo "Or approve it at https://www.npmjs.com/package/tewip-ai"
          } >> "$GITHUB_STEP_SUMMARY"
