# The unit suite, on every push and every pull request.
#
# Phase 61 went looking for why the extension's engine-version guard had drifted fifteen minor
# versions without anybody noticing, wrote a test that fails when it drifts again - and then found
# that **no workflow ran the unit suite at all**. 1,074 tests, every one of them green on the
# author's machine and never run anywhere else.
#
# Every guard written in this repository is a guard against a mistake made once already. A guard
# nothing runs is a comment. The corpus workflow measures what Tewip says about other people's code
# and is deliberately weekly because it clones large repositories; this is the cheap half, and it
# runs every time.
#
# It also typechecks, because the source is .ts run directly by Node with types stripped: nothing
# else would ever catch a type error.
#
# Phase 168: three operating systems, not one.
#
# This repository is written on Windows and was tested only on Linux, so neither half of the gap
# was ever covered. Two bugs have reached main that only appeared on Linux - found by a stranger's
# machine rather than by CI - and in the same session that added this matrix, a new test failed on
# Windows for the opposite reason: `node --import` rejects `c:\...` and needs a file:// URL, which
# a Linux-only CI would have waved through to every Windows user of the package.
#
# It is an npm package an IT department installs on whatever they already run. "It passes on the
# author's machine" was the thing this workflow was created to stop; "it passes on one of the three
# platforms we ship to" is the same sentence with a larger machine.
#
# Public repository, so Windows and macOS runners cost nothing but wall-clock, and all three run at
# once. `fail-fast: false` because "Windows is broken" and "everything is broken" are different
# findings and one run should distinguish them.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: The unit suite
        run: npm run test:engine

      # Not a style rule for its own sake: a file nobody can hold in their head is a file where the
      # next bug hides. Test files are exempt, because a thorough one is long by nature.
      # One pipeline and one awk, deliberately: a `while read` loop fed by a pipe counts in a
      # subshell and loses the result, which is how a check like this passes while finding things.
      # Once, not three times: this reads the files in git and is the same answer on every
      # platform, so running it on all three would only buy three copies of one result.
      - name: Every source file under 300 lines
        if: matrix.os == 'ubuntu-latest'
        run: |
          git ls-files '*.ts' '*.js' \
            | grep -Ev '(^|/)(node_modules|dist|out|fixtures)/' \
            | grep -Ev '\.test\.ts$' \
            | xargs -r wc -l \
            | awk '$2 != "total" && $1 >= 300 { print "::error file=" $2 "::" $1 " lines; this project keeps source files under 300"; bad = 1 } END { exit bad }'
