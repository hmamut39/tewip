# Weekly self-check across public projects: harvest the last week of each project's CI, keep it
# with what earlier weeks harvested (projects delete their CI reports within days, so a real
# dataset can only be built forward), label it from CI evidence, and score the agent against it.
# Nothing is ever posted to the public projects, and collected failure data never enters git.
# A manual run can also publish the shadow report (what the agent would have said) as an issue
# in this private repository.
name: weekly shadow run

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: 'One project to run (supabase, gutenberg, penpot, jupyterlab, lxdui); empty runs all'
        default: ''
      days:
        description: 'How many days back to harvest'
        default: '7'
      publish:
        description: 'Also publish the shadow report as an issue here'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2 # GitHub's API rate limits are per token; two projects at a time stay well inside them
      matrix:
        source: [supabase, gutenberg, penpot, jupyterlab, lxdui]
    steps:
      - name: Skip projects a manual run did not ask for
        id: pick
        run: echo "run=${{ inputs.source == '' || inputs.source == matrix.source }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.pick.outputs.run == 'true'
      - uses: actions/setup-node@v5
        if: steps.pick.outputs.run == 'true'
        with:
          node-version: '24'
      - run: npm ci --omit=optional
        if: steps.pick.outputs.run == 'true'

      - name: Restore what earlier weeks harvested
        if: steps.pick.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/real/${{ matrix.source }}-weekly
          key: shadow-data-${{ matrix.source }}-${{ github.run_id }}
          restore-keys: shadow-data-${{ matrix.source }}-

      - name: Harvest this week's CI
        if: steps.pick.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          from=$(date -u -d "-$DAYS days" +%F)
          to=$(date -u +%F)
          node eval/harvest/harvest.ts "${{ matrix.source }}" --from "$from" --to "$to" --dataset "${{ matrix.source }}-weekly"

      - name: Label and score everything harvested so far
        if: steps.pick.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRIAGE_LLM_MAX_CALLS: '150'
          SOURCE: ${{ matrix.source }}
        run: |
          node eval/harvest/evidence.ts "$SOURCE" "$SOURCE-weekly"
          node eval/harvest/label.ts "$SOURCE-weekly" "eval/ground-truth.$SOURCE-weekly.jsonl" 2020-01-01T00:00:00Z
          {
            echo "## \`$SOURCE\`: accuracy on everything harvested so far"
            echo '```'
            node eval/evaluate.ts "eval/ground-truth.$SOURCE-weekly.jsonl" --data "data/real/$SOURCE-weekly" 2>&1 | tee /dev/stderr || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the shadow report (manual runs only)
        if: steps.pick.outputs.run == 'true' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # SHADOW_REPO must name a PRIVATE repository: these reports read other projects' CI.
        # Without it, nothing is published. shadow.ts refuses a public target as well.
        run: |
          if [ -z "${{ vars.SHADOW_REPO }}" ]; then
            echo "vars.SHADOW_REPO is not set: keeping the report in the artifact instead of publishing it"
            exit 0
          fi
          node scripts/shadow.ts "${{ matrix.source }}" --dataset "${{ matrix.source }}-weekly" --publish "${{ vars.SHADOW_REPO }}"

      - name: Keep the data for next week
        if: always() && steps.pick.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/real/${{ matrix.source }}-weekly
          key: shadow-data-${{ matrix.source }}-${{ github.run_id }}
