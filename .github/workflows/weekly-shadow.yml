# Weekly self-check: harvest the last week of a public project's CI, diagnose it, and post what
# the agent would have said as an issue in THIS private repository. Nothing is ever posted to the
# public project. Collected failure data stays on the runner and is never committed.
name: weekly shadow run

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: 'Public project to shadow (supabase, gutenberg, penpot)'
        default: supabase
      days:
        description: 'How many days back to harvest'
        default: '7'

permissions:
  contents: read
  issues: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --omit=optional
      # Public projects delete their CI reports within days, so the only way to build a real
      # dataset is to keep each week's harvest and add to it. The cache carries it forward.
      - name: Restore what earlier weeks harvested
        uses: actions/cache/restore@v4
        with:
          path: data/real
          key: shadow-data-${{ inputs.source || 'supabase' }}-${{ github.run_id }}
          restore-keys: shadow-data-${{ inputs.source || 'supabase' }}-
      - name: Harvest the public project's CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source || 'supabase' }}
          DAYS: ${{ inputs.days || '7' }}
        run: |
          from=$(date -u -d "-$DAYS days" +%F)
          to=$(date -u +%F)
          node eval/harvest/harvest.ts "$SOURCE" --from "$from" --to "$to" --dataset "$SOURCE-weekly"
      - name: Render and publish the shadow report
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE: ${{ inputs.source || 'supabase' }}
        run: node scripts/shadow.ts "$SOURCE" --dataset "$SOURCE-weekly" --publish ${{ github.repository }}
      # Label the accumulated data from CI evidence and score the agent against it, so the
      # numbers in the README keep being checked on data nobody tuned anything on.
      - name: Label and score the accumulated data
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOURCE: ${{ inputs.source || 'supabase' }}
        run: |
          node eval/harvest/evidence.ts "$SOURCE" "$SOURCE-weekly"
          node eval/harvest/label.ts "$SOURCE-weekly" "eval/ground-truth.$SOURCE-weekly.jsonl" 2020-01-01T00:00:00Z
          {
            echo "## Accuracy on \`$SOURCE\` this week"
            echo '```'
            node eval/evaluate.ts "eval/ground-truth.$SOURCE-weekly.jsonl" --data "data/real/$SOURCE-weekly" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep this week's data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/real
          key: shadow-data-${{ inputs.source || 'supabase' }}-${{ github.run_id }}
