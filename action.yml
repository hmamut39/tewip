name: Tewip
# Quoted, and it has to stay quoted. An unquoted scalar containing ": " is a nested mapping to a
# YAML parser, so this line made the whole manifest unloadable - every release from v0.34.0 onward
# shipped a GitHub Action that failed with "Failed to load action.yml" the moment anyone used it,
# while the README told them `uses: hmamut39/tewip@v0.34.0` worked. Nothing caught it because
# nothing had ever run the action; the workflow that checks Tewip against itself found it in
# minutes. Keep the quotes, and keep that workflow.
description: 'Proves the work: why each test failed, whether a test can fail at all, and what a migration does to a live database.'
branding:
  icon: activity
  color: green
author: Mamuti Aishan (Hasan)

inputs:
  mode:
    description: >-
      triage (default): diagnose this run's failures and deliver. report: build the team report (quality,
      architecture, risk digest) from the stored history, for scheduled workflows. pick: run BEFORE your
      tests and output the test files that could notice this change, with everything it leaves out written
      into the job summary. In pick mode it outputs `tests` and `narrowed`; when it cannot narrow safely,
      `narrowed` is false and `tests` is empty, so a workflow that ignores that still runs everything.
      check: run the verdict verbs over this change - access, schema, vouch, standards, done, perf -
      naming which ones in `checks`. Every one runs even when an earlier one found something, so a
      pull request gets the whole picture in one push rather than one problem at a time.
    default: triage
  checks:
    description: >-
      In check mode, which checks to run, comma separated: done, schema, standards, vouch, access,
      perf - or `all`. Default `done`, which is the one verdict over the whole change. A name Tewip
      has no verb for is reported in the summary rather than ignored.
    default: done
  perf-report:
    description: >-
      In check mode with `perf`, the k6 --summary-export or Lighthouse --output=json file to judge.
      Without it there is nothing to read and the check reports that rather than passing.
    default: ''
  github-token:
    description: Token used to comment, open issues and fix pull requests. Needs contents, pull-requests and issues write permissions.
    default: ${{ github.token }}
  openai-api-key:
    description: Optional. Turns on the AI layer for failures the rules cannot decide. Without it only the rules run.
    default: ''
  blob-report-dir:
    description: Where Playwright's blob reporter wrote its report.
    default: blob-report
  junit-report:
    description: >-
      For any other language or framework: a JUnit XML report, or a directory of them (pytest
      --junitxml, jest-junit, Maven Surefire, Gradle, go-junit-report, .NET JunitXml, Cypress).
      When set, it is read instead of a Playwright blob report. Root-cause triage, history,
      comments and corrections work as for Playwright; there are no traces, so no selector fixes.
    default: ''
  post-pr-comment:
    description: Post (and keep updating) one diagnosis comment on the pull request.
    default: 'true'
  env-issue:
    description: Collect environment failures in one GitHub issue instead of paging per test.
    default: 'true'
  autofix:
    description: Rewrite drifted locators the deterministic rule matched above 0.85, re-run each test, and open a fix pull request with the ones that pass.
    default: 'false'
  verify-command:
    description: Command that runs Playwright tests; auto-fix appends the spec, a grep for the test title and --reporter=json.
    default: npx playwright test
  tests-dir:
    description: Directory auto-fix may edit. Files outside it are never changed.
    default: tests
  gate:
    description: >-
      'real-failures' turns this step into a smart merge gate: it fails only when a failing test is
      a real bug, a changed selector, a test-data problem or undecided, and lets through failures
      that a deterministic rule or a person classified as flaky (TIMING) or environment (ENV).
      AI-only verdicts still block. Put continue-on-error: true on the test step so the gate decides.
      'blocking' is the check-mode gate: it fails the step only on what a verb itself calls
      blocking, so advice and open questions are reported without breaking the build. A gate that
      fires on advice teaches a team to pass continue-on-error, and then it never fires at all.
      Empty (the default) never fails the workflow.
    default: ''
  prove:
    description: >-
      'true' asks Tewip, on a pull request, to break the source files the change touched in small
      deliberate ways - a boundary moved by one, a condition inverted - run the tests that cover them,
      and report every change none of them noticed. Off by default because it is slow: each change
      means a real test run. Every file is put back exactly as it was.
    default: 'false'
  prove-budget:
    description: Seconds Tewip may spend proving a change, across every file. It stops there and says what it did not reach.
    default: '300'
  attest-key:
    description: >-
      Optional. An ed25519 private key (PEM) used to sign the evidence bundle the run writes into
      its artifact. Put it in a secret. Without it the bundle still carries a digest, which shows
      it is undamaged but not that nobody edited it - only a signature says who produced it.
    default: ''
  suite:
    description: >-
      A short name for this test suite, when one workflow triages more than one (e.g. "unit" and
      "e2e"). Each suite then keeps its own history, its own pull request comment and its own
      report artifact instead of overwriting the other's.
    default: ''

outputs:
  tests:
    description: "pick mode only: the test files that could notice this change, space separated. Empty when it would not narrow."
    value: ${{ steps.triage.outputs.tests }}
  narrowed:
    description: "pick mode only: 'true' when the run was narrowed, 'false' when the whole suite should run."
    value: ${{ steps.triage.outputs.narrowed }}
  blocking:
    description: Failing tests that are real bugs, changed selectors, test-data problems or undecided.
    value: ${{ steps.triage.outputs.blocking }}
  flaky:
    description: Failing tests a rule or a person classified as flaky (TIMING).
    value: ${{ steps.triage.outputs.flaky }}
  environment:
    description: Failing tests a rule or a person classified as environment (ENV).
    value: ${{ steps.triage.outputs.environment }}

runs:
  using: composite
  steps:
    - name: Set up Node for triage-agent
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    # The "--" after the suite name ends it: without it, the unnamed suite's key would be a prefix of
    # every named suite's, and "unit" of "unit-e2e", so one suite could restore another's history.
    - name: Restore triage history
      uses: actions/cache/restore@v4
      with:
        path: .triage-agent/history
        key: triage-agent-history-${{ inputs.suite || 'default' }}--${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: triage-agent-history-${{ inputs.suite || 'default' }}--

    - name: Diagnose failures and deliver
      id: triage
      shell: bash
      run: node "$GITHUB_ACTION_PATH/ci/${{ inputs.mode == 'report' && 'report' || inputs.mode == 'pick' && 'pick' || inputs.mode == 'check' && 'check' || 'run' }}.ts"
      env:
        TRIAGE_GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        TRIAGE_BLOB_DIR: ${{ inputs.blob-report-dir }}
        TRIAGE_JUNIT_REPORT: ${{ inputs.junit-report }}
        TRIAGE_POST_PR_COMMENT: ${{ inputs.post-pr-comment }}
        TRIAGE_ENV_ISSUE: ${{ inputs.env-issue }}
        TRIAGE_AUTOFIX: ${{ inputs.autofix }}
        TRIAGE_VERIFY_COMMAND: ${{ inputs.verify-command }}
        TRIAGE_TESTS_DIR: ${{ inputs.tests-dir }}
        TRIAGE_SUITE: ${{ inputs.suite }}
        TRIAGE_GATE: ${{ inputs.gate }}
        TEWIP_PROVE: ${{ inputs.prove }}
        TEWIP_PROVE_BUDGET: ${{ inputs.prove-budget }}
        TEWIP_ATTEST_KEY: ${{ inputs.attest-key }}
        TEWIP_CHECKS: ${{ inputs.checks }}
        TEWIP_PERF_REPORT: ${{ inputs.perf-report }}

    - name: Save triage history
      if: always() && inputs.mode != 'report' && inputs.mode != 'pick' && inputs.mode != 'check'
      uses: actions/cache/save@v4
      with:
        path: .triage-agent/history
        key: triage-agent-history-${{ inputs.suite || 'default' }}--${{ github.run_id }}-${{ github.run_attempt }}

    - name: Upload every role's view
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tewip-report${{ inputs.suite && '-' || '' }}${{ inputs.suite }}
        path: .triage-agent/out
        if-no-files-found: ignore
